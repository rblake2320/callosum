[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callosum"
version = "0.1.0"
description = "Governed dual-hemisphere brain harness: inhibitory evidence-gated bridge, plasticity failover, sealed ledger"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
callosum = "callosum.cli:main"

[tool.setuptools.packages.find]
include = ["callosum*"]
